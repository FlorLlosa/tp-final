services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: tp-final-backend
    container_name: tp-final-laboratorio
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      - PORT=3000
      - MONGO_URL=mongodb://mongo:27017/miapp

  mongo:
    image: mongo:6.0
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: